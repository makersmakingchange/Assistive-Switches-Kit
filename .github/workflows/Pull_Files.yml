# This is a workflow to pull files from another repo to this one.

name: Pull Files

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'Switch to duplicate (Interact, MMC60, Light-Touch, or Raindrop)'
        # Default value if no value is explicitly provided
        default: 'Interact'
        # Input has to be provided for the workflow to run
        required: true
        # The data type of the input
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  pull_files:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4
      # Copy the files from the Interact Switch repo
    - name: copy_files
      run: |
        cd InteractSwitch-master/stl
        git remote origin https://github.com/makersmakingchange/Interact-Switch
        git fetch
        git check origin/master -m /Documentation/*BOM.csv
        git add /Documentation/*BOM.csv
        git status
        git commit -b "Copied BOM csv file from the Interact Swtich repo"
